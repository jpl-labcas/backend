[build-system]
requires = ['hatchling>=1.21']
build-backend = 'hatchling.build'

[project]
name = 'jpl.labcas.backend'
dynamic = ['version']
description = 'Python implementation of the LabCAS data access API with flexible security system.'
keywords = ['data', 'LabCAS', 'cancer', 'backend', 'jpl', 'nist', 'edrn', 'nasa']
requires-python = '>=3.12,<3.15'
license = {file = 'LICENSE.md'}
authors = [
    {name = 'Sean Kelly', email = 'kelly@seankelly.biz'}
]
readme = 'README.md'
dependencies = [
    'fastapi~=0.127.0',
    'uvicorn[standard]~=0.40.0',
    'httpx~=0.28.1',
    'boto3~=1.42.16',
    'python-jose[cryptography]~=3.5.0',
    'redis~=7.1.0',
    'ldap3~=2.9.1',
    'python-dotenv~=1.2.0',
    'pydantic~=2.12.5',
    'pydantic-settings>=2.12.0',
    'python-multipart~=0.0.21',
    'tqdm~=4.66.6'
]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Healthcare Industry',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
]

[project.optional-dependencies]
dev = [ 
    'pytest~=9.0.2',
    'pytest-asyncio~=1.3.0',
    'anyio~=4.12.0',
    'build~=1.5.0'
]

[project.urls]
homepage = 'https://github.com/jpl-labcas/backend'
issues = 'https://github.com/jpl-labcas/backend/issues'

[project.scripts]
labcas-backend = 'jpl.labcas.backend.main:cli'
migrate-solr = 'jpl.labcas.backend.search.migration:main'

[tool.pytest.ini_options]
minversion = '8.0'
addopts = '-q'
testpaths = [
    'tests'
]

[tool.hatch.version]
path = 'src/jpl/labcas/backend/VERSION.txt'
pattern = '(?P<version>.+)'

[tool.hatch.build.targets.wheel]
packages = ['src/jpl']
